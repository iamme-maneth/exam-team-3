<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Bookings — RideNow</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = { theme: { extend: {
      colors: { ink:{900:'#0A0A0F',800:'#12121A',700:'#1A1A24',600:'#242430'}, neon:{purple:'#A855F7',cyan:'#22D3EE',pink:'#EC4899'} },
      fontFamily: { display:['"Space Grotesk"','sans-serif'], sans:['Inter','system-ui','sans-serif'] },
      boxShadow: { glow:'0 0 40px rgba(168,85,247,.35)' }
    }}}
  </script>
  <style>
    body { font-family:'Inter',sans-serif; background:#0A0A0F; color:#E5E7EB; overflow-x:hidden; }
    .glass { background:rgba(26,26,36,.55); backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,.08); }
    .glass-strong { background:rgba(18,18,26,.85); backdrop-filter:blur(24px); border:1px solid rgba(255,255,255,.1); }
    .gradient-text { background:linear-gradient(135deg,#A855F7 0%,#22D3EE 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .btn-gradient { background:linear-gradient(135deg,#A855F7 0%,#22D3EE 100%); color:#fff; font-weight:600; }
    .booking-card { transition:all .25s ease; cursor:pointer; }
    .booking-card:hover { transform:translateY(-3px); border-color:rgba(168,85,247,.4); box-shadow:0 15px 40px rgba(168,85,247,.15); }
  </style>
</head>
<body class="min-h-screen">

  <header class="relative z-10 px-4 sm:px-8 py-5 border-b border-white/5">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-xl bg-gradient-to-br from-neon-purple to-neon-cyan flex items-center justify-center shadow-glow">
          <i class="fa-solid fa-bolt text-white text-lg"></i>
        </div>
        <span class="font-display text-2xl font-bold text-white">Ride<span class="gradient-text">Now</span></span>
      </a>
      <a href="index.html" class="btn-gradient px-5 py-2.5 rounded-xl text-sm"><i class="fa-solid fa-plus mr-2"></i> New Booking</a>
    </div>
  </header>

  <main class="relative z-10 px-4 sm:px-8 py-8">
    <div class="max-w-4xl mx-auto space-y-6">

      <div>
        <h1 class="font-display text-3xl font-bold text-white mb-1">My Bookings</h1>
        <p class="text-gray-500 text-sm">All your past and upcoming rides.</p>
      </div>

      <div id="bookingList" class="space-y-4"></div>

    </div>
  </main>

  <script>
    const bookings = JSON.parse(localStorage.getItem('bookings') || '[]');
    const container = document.getElementById('bookingList');

    if (!bookings.length) {
      container.innerHTML = `
        <div class="glass-strong rounded-2xl p-16 text-center">
          <div class="w-20 h-20 mx-auto rounded-full bg-gradient-to-br from-neon-purple/20 to-neon-cyan/20 flex items-center justify-center mb-4">
            <i class="fa-solid fa-car text-3xl text-neon-purple"></i>
          </div>
          <h3 class="font-display font-bold text-white text-lg mb-1">No bookings yet</h3>
          <p class="text-sm text-gray-500 mb-6">Book your first ride to see it here.</p>
          <a href="index.html" class="btn-gradient inline-block px-6 py-3 rounded-xl text-sm">
            <i class="fa-solid fa-plus mr-2"></i> Book a Ride
          </a>
        </div>
      `;
    } else {
      const ICONS = { moto:'🏍️', tuktuk:'🛺', economy:'🚗', comfort:'🚙' };
      const METHOD_LABEL = { khqr:'KHQR', visa:'Visa', cash:'Cash' };

      bookings.forEach(b => {
        const card = document.createElement('article');
        card.className = 'booking-card glass-strong rounded-2xl overflow-hidden';

        card.innerHTML = `
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 px-6 py-4 border-b border-white/5">
            <div class="flex items-center gap-3">
              <span class="font-mono font-semibold text-white text-sm">${b.id}</span>
              <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-green-500/20 text-green-400 border border-green-500/30">Confirmed</span>
            </div>
            <div class="text-xs text-gray-500">${new Date(b.createdAt).toLocaleString()}</div>
          </div>

          <div class="p-6 grid sm:grid-cols-[auto_1fr_auto] gap-5 items-center">

            <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-neon-purple/20 to-neon-cyan/20 flex items-center justify-center text-3xl">
              ${ICONS[b.ride_type] || '🚗'}
            </div>

            <div class="space-y-3 text-sm min-w-0">
              <div class="flex items-start gap-3">
                <span class="w-2.5 h-2.5 mt-1.5 rounded-full bg-gradient-to-br from-neon-purple to-neon-pink shrink-0"></span>
                <div class="min-w-0">
                  <div class="text-[10px] text-gray-500 uppercase tracking-wider">Pickup</div>
                  <div class="text-gray-200 text-xs truncate">${b.pickup_location}</div>
                </div>
              </div>
              <div class="flex items-start gap-3">
                <span class="w-2.5 h-2.5 mt-1.5 rounded-full bg-gradient-to-br from-neon-cyan to-blue-500 shrink-0"></span>
                <div class="min-w-0">
                  <div class="text-[10px] text-gray-500 uppercase tracking-wider">Drop-off</div>
                  <div class="text-gray-200 text-xs truncate">${b.drop_location}</div>
                </div>
              </div>
              <div class="flex flex-wrap gap-3 pt-1 text-[11px] text-gray-500">
                <span><i class="fa-solid fa-user mr-1"></i>${b.driver_name}</span>
                <span><i class="fa-solid fa-route mr-1"></i>${b.distance_km} km</span>
                <span><i class="fa-solid fa-clock mr-1"></i>${b.duration_min} min</span>
                <span><i class="fa-solid fa-credit-card mr-1"></i>${METHOD_LABEL[b.payment_method] || b.payment_method}</span>
              </div>
            </div>

            <div class="text-right">
              <div class="font-display text-2xl font-bold gradient-text">$${b.total}</div>
              <div class="text-[10px] text-gray-500">${b.total_riel}</div>
            </div>

          </div>
        `;

        card.addEventListener('click', () => {
          localStorage.setItem('lastBooking', JSON.stringify(b));
          window.location.href = 'receipt.html';
        });

        container.appendChild(card);
      });
    }
  </script>
</body>
</html>
